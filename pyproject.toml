[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kydo-stemmer"
version = "0.1.0"
description = "In-memory complete-track SCNet XL IHF inference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0.1"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["stemmer*"]

[project.optional-dependencies]
validation = ["psutil>=6,<8", "soundfile", "tqdm"]
